services:
  collector:
    profiles:
      - real
    build:
      context: .
      target: collector
      args:
        PYTHON_PACKAGE_INDEX: "${PYTHON_PACKAGE_INDEX:-https://pypi.org/simple}"
    user: "${COLLECTOR_UID:-10001}:10001"
    environment:
      GITHUB_APP_ID: "${GITHUB_APP_ID:?Set GITHUB_APP_ID}"
      GITHUB_INSTALLATION_ID: "${GITHUB_INSTALLATION_ID:?Set GITHUB_INSTALLATION_ID}"
      GITHUB_ENTERPRISE: "${GITHUB_ENTERPRISE:?Set GITHUB_ENTERPRISE}"
      COLLECT_DAYS: "${COLLECT_DAYS:-7}"
      COLLECT_INTERVAL_SECONDS: "${COLLECT_INTERVAL_SECONDS:-86400}"
      ALLOW_MISSING_METRICS: "${ALLOW_MISSING_METRICS:-false}"
    secrets:
      - github_app_key
    volumes:
      - snapshots:/data
    networks:
      - outbound
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import datetime,json,os; s=json.load(open('/data/status.json')); age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(s['lastAttempt'])).total_seconds(); assert age<int(os.getenv('COLLECT_INTERVAL_SECONDS','86400'))+3600"
      interval: 60s
      timeout: 3s
      start_period: 30s
      retries: 3

networks:
  outbound:

secrets:
  github_app_key:
    file: "${GITHUB_APP_PRIVATE_KEY_FILE:?Set an absolute private key path outside this project}"
