services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - snapshots:/data:ro
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  snapshots:

networks:
  private:
